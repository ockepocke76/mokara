# --- Default Parameter Templates ---
# This section defines the full configuration for common parameters.
# Individual assets below can then override just the 'value' or other specific fields.
_defaults:
  num_years:
    display_name: Number of Years
    description: Simulation horizon in years.
    min: 1
    max: 50
    step: 1
    slider_format: '%d'
  asset_management_fee:
    display_name: Asset Management Fee
    description: Annual fee on total asset value.
    min: 0.0
    max: 0.05
    step: 0.001
    slider_format: '%.3f%%'
  loan_interest_rate:
    display_name: Loan Interest Rate
    description: Annual loan interest rate when using this asset as collateral.
    min: 0.0
    max: 0.15
    step: 0.01
    slider_format: '%.2f%%'
  return_threshold_rate:
    display_name: Return Threshold
    description: For bootstrap models, this caps the maximum annual return that can be sampled from historical data.
    min: 0.5
    max: 5.0
    step: 0.1
    slider_format: '%.2f%%'
  annual_return:
    display_name: Annual Return
    description: Assumed average annual return for the asset.
    min: 0.0
    max: 0.5
    step: 0.01
    slider_format: '%.1f%%'
  annual_volatility:
    display_name: Annual Volatility
    description: Assumed annual volatility (risk) of the asset.
    min: 0.0
    max: 0.5
    step: 0.01
    slider_format: '%.1f%%'
  synthetic_data_years:
    display_name: Synthetic Data Years
    description: Number of years of synthetic history to generate for bootstrapping.
    min: 5
    max: 50
    step: 5
    slider_format: '%d'

# --- Asset-Specific Definitions ---

bootstrap_gspc:
  display_name: "S&P 500"
  type: "historical_bootstrap"
  ticker_symbol: "^GSPC"
  enabled: true
  description: "The S&P 500 is a stock market index that tracks the stock performance of 500 of the largest public companies in the United States. It is widely considered a key indicator of the overall health of the U.S. stock market and economy."
  parameters:
    local_file_path: "assets/bootstrap_gspc.csv"
    date_column: "date"
    price_column: "close"
    bootstrap_start_date:
      display_name: "Bootstrap Start Date"
      description: "The earliest date to include in the historical data for bootstrapping."
      widget: "date_input"
      value: null # This will be dynamically populated
    bootstrap_end_date:
