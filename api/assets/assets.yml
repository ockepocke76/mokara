parametric:
  display_name: "Synthetic Parametric Model"
  type: "parametric"
  enabled: true
  description: A synthetic model that generates returns based on a normal distribution with a user-defined mean (annual return) and volatility. Useful for testing theoretical scenarios.
  parameters:
    num_years: 30
    annual_return: 0.09
    annual_volatility: 0.10
    asset_management_fee: 0.0025
    loan_interest_rate: 0.05

parametric_60_40:
  display_name: "Synthetic 60/40 Stock/Bond Portfolio"
  type: "parametric"
  enabled: true
  description: A synthetic model representing a classic 60/40 portfolio of stocks and bonds, assuming long-term historical averages for returns and volatility.
  parameters:
    num_years: 30
    annual_return: 0.07
    annual_volatility: 0.11
    asset_management_fee: 0.01
    loan_interest_rate: 0.05

bootstrap_synthetic:
  display_name: "Synthetic Bootstrap Model"
  type: "synthetic_bootstrap"
  enabled: true
  description: Generates a synthetic price history based on user-defined parameters, then uses that history for bootstrapping. Combines parametric control with bootstrap's ability to capture sequence risk.
  parameters:
    num_years: 30
    annual_return: 0.09
    annual_volatility: 0.15
    asset_management_fee: 0.004
    synthetic_data_years: 30

